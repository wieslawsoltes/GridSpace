name: Parity validation toolchain
on:
  push:
    branches: [feat/arrays-performance]
    paths: [.github/workflows/parity-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/parity-nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          dotnet test tests/GridSpace.Tests -c Release
          npm ci
          npx playwright install --only-shell chromium
      - name: Archive public toolchain dependencies separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity-tools/dotnet/sdk /tmp/parity-tools/dotnet/shared/Microsoft.NETCore.App /tmp/parity-tools/dotnet/packs
          SDK=$(dotnet --version)
          RUNTIME=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ {print $2}' | sort -V | tail -1)
          cp /usr/share/dotnet/dotnet /tmp/parity-tools/dotnet/
          cp -a /usr/share/dotnet/host /tmp/parity-tools/dotnet/
          cp -a "/usr/share/dotnet/sdk/$SDK" /tmp/parity-tools/dotnet/sdk/
          cp -a "/usr/share/dotnet/shared/Microsoft.NETCore.App/$RUNTIME" /tmp/parity-tools/dotnet/shared/Microsoft.NETCore.App/
          for name in Microsoft.NETCore.App.Ref Microsoft.NETCore.App.Host.linux-x64; do
            VERSION=$(ls /usr/share/dotnet/packs/$name | grep '^10\.' | sort -V | tail -1)
            mkdir -p /tmp/parity-tools/dotnet/packs/$name
            cp -a /usr/share/dotnet/packs/$name/$VERSION /tmp/parity-tools/dotnet/packs/$name/
          done
          tar -C /tmp/parity-tools -czf /tmp/parity-sdk.tar.gz dotnet
          tar -C /tmp -czf /tmp/parity-nuget.tar.gz parity-nuget
          mkdir -p /tmp/parity-browser
          cp -a node_modules /tmp/parity-browser/
          cp -a "$HOME/.cache/ms-playwright" /tmp/parity-browser/
          tar -C /tmp/parity-browser -czf /tmp/parity-browser.tar.gz .
          du -h /tmp/parity-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: parity-sdk
          path: /tmp/parity-sdk.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: parity-nuget
          path: /tmp/parity-nuget.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: parity-browser
          path: /tmp/parity-browser.tar.gz
          retention-days: 1
          compression-level: 0
