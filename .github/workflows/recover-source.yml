name: Recover hierarchy source
on:
  push:
    branches: [feat/charts-pivots-wysiwyg]
    paths: [.github/workflows/recover-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=/tmp/GridSpace-hierarchy-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hierarchy-source
          path: /tmp/GridSpace-hierarchy-source.zip
          retention-days: 2
