name: Desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch verified application font assets
        run: python scripts/fetch-assets.py
      - name: Build shared native host
        run: dotnet build src/GridSpace.App/GridSpace.App.csproj -f net10.0-desktop -c Release -p:GridSpaceDesktopOnly=true
